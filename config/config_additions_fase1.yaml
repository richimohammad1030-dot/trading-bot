# ============================================================
# TAMBAHAN config.yaml UNTUK FASE 1 (screener.py + zone_state.py)
# REVISI: H4 sebagai timeframe bias DIBUANG. Hanya 2 timeframe:
# structure_tf (H1, bias+struktur+area) dan timing_tf (M5, eksekusi).
# ============================================================
# Tempelkan blok ini ke config.yaml yang SUDAH ADA di project Anda
# (D:\trading_bot\config\config.yaml). JANGAN timpa file lama --
# gabungkan section baru ini ke bawahnya. Kalau sebelumnya Anda
# sudah menempel versi LAMA config_additions_fase1.yaml (yang masih
# ada bias_tf/bias_lookback H4), GANTI section screener_timeframes
# itu dengan yang di bawah ini.
#
# Referensi: v2.0 Bab 1.3 (timeframe-agnostic / prinsip fraktal),
# revisi bias H1 via bos_choch (sesi Opus, diverifikasi diag_bias.py).

# Timeframe-agnostic (v2.0 Bab 1.3): HANYA 2 timeframe sekarang.
# Ganti dua nilai ini saja untuk beralih skala (mis. scalping nanti:
# structure_tf=M15, timing_tf=M1) tanpa ubah kode.
screener_timeframes:
  structure_tf: "H1"         # bias + fase struktur + area penting
  structure_lookback: 200    # cukup utk beberapa event BOS/CHoCH
  timing_tf: "M5"            # lensa reaksi / gate timing
  timing_lookback: 20

# Ambang keluar zona (v2.1 Bab 5.3): dipakai zone_state.py untuk
# menentukan kapan harga dianggap benar-benar "keluar" dari zona
# (bukan sekadar goyang kecil), memicu reset debounce.
zone_exit:
  multiplier: 0.5             # relatif terhadap max(lebar_zona, ATR)

# Identitas zona (v2.1 Bab 6.1): ambang overlap untuk menganggap dua
# deteksi sebagai "zona yang sama" lintas waktu.
zone_identity:
  overlap_threshold: 0.60

# Bias dari bos_choch (Opsi B, dikunci sesi Opus): jumlah event
# BOS/CHoCH terakhir yang dicek untuk menentukan konsistensi arah.
bias_structure:
  lookback_events: 3

# EQH/EQL (Fase 2, v2.0 Bab 3.3 Tahap 2): parameter deteksi liquidity
# pool via smc.liquidity(). range_percent = toleransi pengelompokan
# swing high/low yang dianggap "equal" (1% dari range candle).
# zone_buffer_atr = lebar zona tipis di sekitar level (sama pola
# dengan SBR/RBS: level ± ATR*0.2).
liquidity:
  swing_length: 5
  range_percent: 0.01
  zone_buffer_atr: 0.2

# Struktur swing fresh (Fase 2, v2.0 Bab 3.3 Tahap 3): swing high/low
# yang BELUM ditembus BOS -- resistance/support murni di depan harga.
# broken_level_tolerance_atr = toleransi pencocokan level swing vs
# level BOS/CHoCH historis (utk menentukan "sudah ditembus" atau belum).
# max_zones_per_type = maks berapa swing high & swing low terbaru yang
# diambil (masing-masing).
swing_structure:
  zone_buffer_atr: 0.2
  broken_level_tolerance_atr: 0.1
  max_zones_per_type: 1   # REVISI: diturunkan dari 2 -> 1 setelah
  # replay_gate_check.py menunjukkan SWING_HIGH+SWING_LOW mendominasi
  # ~70% (205/294) total kandidat -- jauh lebih sering dari tipe zona
  # lain (OB/FVG/SBR/RBS/SD gabungan hanya ~30%). Ambil HANYA swing
  # high & swing low TERBARU (paling dekat harga), bukan 2 terakhir,
  # untuk menjaga volume kandidat tetap sesuai target intraday
  # (~1 sinyal/hari) tanpa membanjiri Tier 2 dengan API call.

# Supply/Demand (Fase 2, v2.0 Bab 3.3 Tahap 4): basing (konsolidasi
# sempit) + displacement (breakout tajam). Ambang dari v2.0 Bab 3.1 +
# addendum -- akan dikalibrasi ulang setelah backtest nyata.
supply_demand:
  min_basing_candles: 3
  max_basing_candles: 6
  basing_range_atr_multiplier: 1.5   # lebar basing maks vs ATR
  basing_body_ratio_max: 0.5         # body/range maks tiap candle basing
  displacement_atr_multiplier: 2.0   # range candle displacement min vs ATR
  max_zones: 5                       # maks zona S&D yang di-scan per siklus

# NOTE: Parameter berikut dari config LAMA harus tetap ada karena
# masih dipakai modul yang di-reuse (structure.py, orderblock.py,
# indicators.py, spread_filter.py) -- TIDAK dihapus di Fase 1:
#   adx: {period}          -- ADX tetap dihitung sbg DATA PENDUKUNG
#                              utk Tier 2 (v2.0 Bab 7), BUKAN penentu
#                              bias lagi. trending_above/ranging_below
#                              boleh dibiarkan meski tidak dipakai
#                              screener.py.
#   atr: {period, read_offset, avg_period_days}
#   ema: {fast, slow}      -- EMA20/50 juga DATA PENDUKUNG, bukan
#                              penentu bias
#   pairs: {group_a, group_b, independent}
#   spread: {<PAIR>: {baseline, skip_above}}
#   risk: {per_trade_pct, daily_limit_pct, ...}
#
# DIHAPUS dari screener_timeframes (revisi ini): bias_tf, bias_lookback
# -- H4 tidak lagi dipakai sebagai timeframe bias sama sekali.
#
# Parameter LAMA yang SUDAH TIDAK DIPAKAI screener.py (boleh dibiarkan,
# akan dibersihkan bertahap saat modul lama resmi dipensiunkan):
#   timeframes.entry / entry_fallback (M15/M30 confirmation mekanis --
#   digantikan gate M5 close-in-zone yang jauh lebih sederhana)
